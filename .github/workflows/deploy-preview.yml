# Deploy RVTools Visualiser PRERELEASE to Azure Static Web Apps
#
# Triggers on push to non-main branches when index.html changes.
# Stages the feature branch's index.html as `index-prerelease.html`,
# and re-stages main's index.html so production `/` is untouched.
# Result: https://<swa>/index-prerelease.html is updated; production `/` stays on main's build.

name: Deploy Prerelease to Azure Static Web Apps

on:
  push:
    branches-ignore: [main]
    paths:
      - 'index.html'
      - 'config.json'
      - 'data/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Prerelease Site
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rvtoolsviz.djtools.co.nz/index-prerelease.html
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Stage prerelease payload alongside main's index.html
        run: |
          mkdir -p staging
          # Feature-branch build published as index-prerelease.html
          cp index.html staging/index-prerelease.html
          # Pull main's index.html so production `/` (index.html) is preserved
          git fetch origin main --depth=1
          git show origin/main:index.html > staging/index.html
          # Carry over config + data folder so the SWA full-replace doesn't
          # wipe the live SKU pricing files (data/*.json) that the prerelease
          # AND production both fetch at runtime.
          if [ -f config.json ]; then cp config.json staging/; fi
          if [ -d data ]; then cp -r data staging/data; fi

      - name: Deploy to Azure Static Web Apps
        env:
          SWA_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          npx --yes @azure/static-web-apps-cli@latest deploy ./staging \
            --deployment-token "$SWA_TOKEN" \
            --env production

      - name: Write run summary
        run: |
          {
            echo "### Deployed prerelease build :test_tube:"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Preview URL: https://rvtoolsviz.djtools.co.nz/index-prerelease.html"
            echo "- Production (\`/\`) is unchanged — still serving \`main\`'s build."
          } >> "$GITHUB_STEP_SUMMARY"
