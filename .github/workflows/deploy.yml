# Deploy RVTools Visualiser to Azure Static Web Apps
#
# Triggers on push to main (when index.html changes) and manual dispatch.
# Runs on a GitHub-hosted ubuntu-latest runner.
# Requires the production environment to expose the SWA_DEPLOYMENT_TOKEN secret.

name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.json'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Static Website
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rvtoolsviz.djtools.co.nz/
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Stage deployment payload
        run: |
          mkdir -p staging
          cp index.html staging/
          # SWA deploy is a full replace of the served site, so any file not
          # staged here is removed from production. Carry over config.json and
          # the data/ folder (SKU pricing + region catalog) explicitly.
          if [ -f config.json ]; then cp config.json staging/; fi
          if [ -d data ]; then cp -r data staging/data; fi
          # Preserve the prerelease build so production deploys don't wipe
          # /index-prerelease.html. Pull it from the active prerelease branch
          # (skipped silently if the branch doesn't exist).
          PRERELEASE_BRANCH="feature/skur-rebuild"
          if git fetch origin "$PRERELEASE_BRANCH" --depth=1 2>/dev/null; then
            git show "origin/$PRERELEASE_BRANCH:index.html" > staging/index-prerelease.html \
              && echo "Staged index-prerelease.html from $PRERELEASE_BRANCH" \
              || rm -f staging/index-prerelease.html
          else
            echo "Prerelease branch $PRERELEASE_BRANCH not found — skipping."
          fi

      - name: Deploy to Azure Static Web Apps
        env:
          SWA_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          npx --yes @azure/static-web-apps-cli@latest deploy ./staging \
            --deployment-token "$SWA_TOKEN" \
            --env production

      - name: Write run summary
        run: |
          {
            echo "### Deployed to Azure Static Web Apps :rocket:"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- URL: https://rvtoolsviz.djtools.co.nz/"
          } >> "$GITHUB_STEP_SUMMARY"
